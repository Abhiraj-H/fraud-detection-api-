version: "3.9"

services:
  fraud-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  dashboard:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "pip install -q streamlit plotly pandas scikit-learn joblib scipy xgboost &&
             streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      fraud-api:
        condition: service_healthy
    restart: unless-stopped